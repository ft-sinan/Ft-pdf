plugins { id 'com.android.application' }

final productionVersion = new groovy.json.JsonSlurper().parse(rootProject.file('../package.json')).version
final productionCode = 9
// A lower-code, release-mode fixture for testing the first production update.
// It is never a release candidate; the publication gate rejects its version name.
final upgradeFixture = providers.gradleProperty('ftUpgradeFixture').orNull == 'true'
android {
    namespace 'studio.ftpdf.app'
    compileSdk 35
    defaultConfig {
        applicationId 'studio.ftpdf.app'
        minSdk 26
        targetSdk 35
        versionCode(upgradeFixture ? productionCode - 1 : productionCode)
        versionName(upgradeFixture ? "${productionVersion}-upgrade-fixture" : productionVersion)
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    buildTypes {
        release {
            debuggable false
            jniDebuggable false
            // Signing is deliberately separate: Gradle/npm never receive the release key.
            signingConfig null
        }
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    sourceSets.main.assets.srcDir(layout.buildDirectory.dir('generated/ftAssets'))
    sourceSets.androidTest.assets.srcDir(rootProject.file('../tests/fixtures'))
}

// A normal Gradle/Studio build must never produce a launcher without its editors.
final repo = rootProject.projectDir.parentFile
final studio = tasks.register('bundleDeviceStudio', Exec) {
    workingDir repo
    commandLine 'npm', 'run', 'build:device'
    inputs.files(fileTree(repo) {
        include 'scripts/build-device.mjs', 'package*.json', 'vite.config.ts', 'tsconfig.json', 'index.html', 'src/**', 'shared/**', 'server/**', 'public/brand.svg', 'public/fonts/**', 'public/icons/**'
    })
    outputs.dir(layout.buildDirectory.dir('generated/ftAssets'))
}
tasks.named('preBuild').configure { dependsOn(studio) }

dependencies {
    implementation 'androidx.core:core:1.13.1' // FileProvider for a one-photo camera grant
    implementation 'androidx.webkit:webkit:1.12.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
}
