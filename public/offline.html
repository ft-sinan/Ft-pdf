<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  /><meta name="theme-color" content="#fbfaf7" /><title>Ft PDF — Offline</title
  ><style>
    body {
      margin: 0;
      display: grid;
      place-content: center;
      min-height: 100dvh;
      background: #fbfaf7;
      color: #302c26;
      font: 16px/1.6 system-ui;
    }
    main {
      max-width: 380px;
      padding: 30px;
    }
    img {
      width: 48px;
      height: 48px;
    }
    h1 {
      font-size: 30px;
      letter-spacing: -1px;
      line-height: 1.2;
    }
    p {
      color: #726e65;
    }
    button {
      background: #ad4637;
      color: white;
      border: 0;
      border-radius: 7px;
      font: 600 14px system-ui;
      padding: 12px 18px;
      cursor: pointer;
    }
  </style>
  <main>
    <img src="/brand.svg" alt="Ft PDF" />
    <h1>You’re offline</h1>
    <p>Your saved documents are safe in your workspace. Reconnect to open files or sync changes.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</html>
