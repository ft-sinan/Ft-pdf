name: Android debug APK
on:
  push:
    paths: ['android/**', 'src/**', 'shared/**', 'server/**', 'public/fonts/**', 'public/icons/**', 'public/brand.svg', 'scripts/build-device.mjs', 'package*.json', 'index.html', '*config.ts', 'tsconfig.json', 'tests/fixtures/**', 'tests/device-tools.mjs', '.github/workflows/android-debug.yml']
  pull_request:
    paths: ['android/**', 'src/**', 'shared/**', 'server/**', 'public/fonts/**', 'public/icons/**', 'public/brand.svg', 'scripts/build-device.mjs', 'package*.json', 'index.html', '*config.ts', 'tsconfig.json', 'tests/fixtures/**', 'tests/device-tools.mjs', '.github/workflows/android-debug.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: Build and verify debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      # ubuntu-24.04 includes these SDK packages; do not reinstall obsolete SDK tools.
      - name: Check preinstalled Android SDK 35
        run: test -f "$ANDROID_HOME/platforms/android-35/android.jar" && test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
      # Only the explicitly requested publication job can receive a persistent debug key.
      # PR/test builds remain disposable. No private key is put in Git, artifacts or caches.
      - name: Use maintainer-provided update signer when configured
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-debug-apk]')
        env:
          KEYSTORE_B64: ${{ secrets.FT_PDF_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -eu
          if [ -z "$KEYSTORE_B64" ]; then
            echo 'No persistent debug signer configured; compare certificates before installing over an old version.'
          else
            umask 077
            mkdir -p "$HOME/.android"
            printf '%s' "$KEYSTORE_B64" | base64 --decode > "$HOME/.android/debug.keystore"
            keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias AndroidDebugKey >/dev/null
          fi
      - name: Test and assemble
        working-directory: android
        run: |
          set -o pipefail
          if ! ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest 2>&1 | tee "$RUNNER_TEMP/android-build.log"; then
            python3 - "$RUNNER_TEMP/android-build.log" <<'PYERROR'
          import pathlib,re,sys
          text=pathlib.Path(sys.argv[1]).read_text(errors='replace')
          failure=text.partition('* What went wrong:')[2].partition('* Try:')[0].strip()
          details='\n'.join(re.findall(r'(?m)^.{0,260}(?:error:|failed to resolve|could not download).{0,450}$',text,re.I)[-4:])
          reason=(details+'\n'+(failure or text[-1400:])).strip()
          print('::error title=Android build::'+reason[:1800].replace('%','%25').replace('\r','').replace('\n','%0A'))
          PYERROR
            exit 1
          fi
      - name: Check the bundled offline tool outputs
        run: |
          # Hosted ubuntu-24.04 includes Chrome. Test our APK assets, without a second browser download.
          export FT_CHROMIUM="$(command -v google-chrome)"
          "$FT_CHROMIUM" --version
          set -o pipefail
          if ! timeout 180s node tests/device-tools.mjs 2>&1 | tee "$RUNNER_TEMP/offline-tools.log"; then
            python3 -c 'import os,pathlib; print("::error title=Bundled offline tools::"+pathlib.Path(os.environ["RUNNER_TEMP"],"offline-tools.log").read_text()[-1500:].replace("%","%25").replace("\n","%0A"))'
            exit 1
          fi
      - name: Check signature and record checksum
        run: |
          set -euo pipefail
          trap 'echo "::error title=APK packaging::Failed at line $LINENO: $BASH_COMMAND"; if [ -f entries.txt ]; then grep -E "^assets/(studio/(ocr/|index.html|assets/(pdf.worker|codec.worker))|creator-contacts)" entries.txt || true; fi' ERR
          mkdir -p "$RUNNER_TEMP/ft-apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/ft-apk/ft-pdf-debug.apk"
          cd "$RUNNER_TEMP/ft-apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose ft-pdf-debug.apk
          unzip -Z1 ft-pdf-debug.apk > entries.txt
          grep -q '^assets/studio/index.html$' entries.txt
          grep -qx 'assets/creator-contacts.json' entries.txt
          if grep -q '^assets/seed/' entries.txt; then echo '::error::Sample library assets must not ship'; exit 1; fi
          # Use a neutral asset suffix: mergeAssets treats .gz files specially.
          grep -qx 'assets/studio/ocr/english-model.bin' entries.txt
          for file in worker.js english-model.bin; do
            unzip -p ft-pdf-debug.apk "assets/studio/ocr/$file" | cmp - "$GITHUB_WORKSPACE/android/app/build/generated/ftAssets/studio/ocr/$file"
          done
          grep -q '^assets/studio/assets/pdf.worker' entries.txt
          grep -q '^assets/studio/assets/codec.worker' entries.txt
          rm entries.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions ft-pdf-debug.apk > permissions.txt
          if grep -q android.permission.INTERNET permissions.txt; then echo "::error::Unexpected INTERNET permission in installed manifest"; exit 1; fi
          grep -q android.permission.CAMERA permissions.txt
          if grep -q android.permission.RECORD_AUDIO permissions.txt; then echo "::error::Unexpected microphone permission"; exit 1; fi
          rm permissions.txt
          sha256sum ft-pdf-debug.apk | tee SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ft-instrumentation
          path: android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          retention-days: 5
      - name: Upload installable APK
        id: apk
        uses: actions/upload-artifact@v4
        with:
          name: ft-pdf-debug-apk
          path: ${{ runner.temp }}/ft-apk/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Link artifact in run summary
        run: echo '[Download the debug APK artifact](${{ steps.apk.outputs.artifact-url }}). Extract the ZIP and install `ft-pdf-debug.apk`.' >> "$GITHUB_STEP_SUMMARY"
  studio-device-test:
    name: Test the installed studio offline
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with: { name: ft-pdf-debug-apk, path: '${{ runner.temp }}/device-apks' }
      - uses: actions/download-artifact@v4
        with: { name: ft-instrumentation, path: '${{ runner.temp }}/device-tests' }
      - run: cp "$RUNNER_TEMP/device-tests/app-debug-androidTest.apk" "$RUNNER_TEMP/device-apks/test.apk"
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          APK_DIR: ${{ runner.temp }}/device-apks
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back emulated
          disable-animations: true
          working-directory: android
          script: bash ci/check-studio-on-device.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-device-results
          path: ${{ runner.temp }}/studio-device-results/
          if-no-files-found: ignore
          retention-days: 7

  # An explicit commit marker requests a direct APK link in addition to the normal Actions ZIP.
  # Only trusted pushes can publish, never PR builds. Never force-push or overwrite newer changes.
  publish-download:
    name: Publish verified APK to source branch
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-debug-apk]')
    needs: [build, studio-device-test]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/download-artifact@v4
        with:
          name: ft-pdf-debug-apk
          path: ${{ runner.temp }}/verified-apk
      - name: Publish the tested binary and checksum
        env:
          SOURCE_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "$SOURCE_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          (cd "$RUNNER_TEMP/verified-apk" && sha256sum --check SHA256SUMS.txt)
          mkdir -p public/downloads
          install -m 644 "$RUNNER_TEMP/verified-apk/ft-pdf-debug.apk" public/downloads/ft-pdf-debug.apk
          install -m 644 "$RUNNER_TEMP/verified-apk/SHA256SUMS.txt" public/downloads/SHA256SUMS.txt
          git add -- public/downloads/ft-pdf-debug.apk public/downloads/SHA256SUMS.txt
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m "Publish tested Android debug APK from Actions run $GITHUB_RUN_ID"
            git push origin "$SOURCE_BRANCH"
          fi
          echo "[Download the APK directly]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/raw/$(git rev-parse HEAD)/public/downloads/ft-pdf-debug.apk)" >> "$GITHUB_STEP_SUMMARY"
