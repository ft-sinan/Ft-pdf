name: Android debug APK
on:
  push:
    paths: ['android/**', '.github/workflows/android-debug.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android-debug.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: Build and verify debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Test and assemble
        working-directory: android
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Check signature and record checksum
        run: |
          mkdir -p "$RUNNER_TEMP/ft-apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/ft-apk/ft-pdf-debug.apk"
          cd "$RUNNER_TEMP/ft-apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose ft-pdf-debug.apk
          sha256sum ft-pdf-debug.apk | tee SHA256SUMS.txt
      - name: Upload installable APK
        id: apk
        uses: actions/upload-artifact@v4
        with:
          name: ft-pdf-debug-apk
          path: ${{ runner.temp }}/ft-apk/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Link artifact in run summary
        run: echo '[Download the debug APK artifact](${{ steps.apk.outputs.artifact-url }}). Extract the ZIP and install `ft-pdf-debug.apk`.' >> "$GITHUB_STEP_SUMMARY"
  pdf-device-test:
    name: Test PDF creation on Android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          disable-animations: true
          working-directory: android
          script: ./gradlew --no-daemon :app:connectedDebugAndroidTest
