name: Stage tested APK on a draft release
on:
  push:
    branches: ['**']
  workflow_dispatch:
permissions: {}

# Create a draft targeting the APK publication commit first. A trusted push with
# [stage-apk-release] (or dispatch) stages assets only; publication is explicit.
jobs:
  stage:
    if: github.ref_type == 'branch' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[stage-apk-release]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify, attach and read back the original assets (no rebuild)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          dir=public/downloads
          apk=ft-pdf-debug.apk
          commit=$(git log -1 --format=%H -- "$dir/$apk")
          tag=v$(git show "$commit:package.json" | jq -er .version)
          [[ $tag =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          draft=$(gh release view "$tag" --json isDraft,targetCommitish,assets)
          jq -e --arg commit "$commit" '.isDraft and .targetCommitish == $commit' <<<"$draft" >/dev/null

          # Authenticate the source of these bytes, not just the adjacent checksum.
          subject=$(git show -s --format=%s "$commit")
          publication='^Publish tested Android debug APK from Actions run ([0-9]+)$'
          [[ $subject =~ $publication ]]
          run=${BASH_REMATCH[1]}
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" | jq -e \
            --arg parent "$(git rev-parse "$commit^")" --arg branch "$GITHUB_REF_NAME" \
            '.event == "push" and .head_sha == $parent and .head_branch == $branch and
             .path == ".github/workflows/android-debug.yml" and .conclusion == "success"' >/dev/null
          original="$RUNNER_TEMP/verified-apk"
          gh run download "$run" --name ft-pdf-debug-apk --dir "$original"
          (cd "$original" && sha256sum --strict --check SHA256SUMS.txt)
          git diff --exit-code "$commit" HEAD -- "$dir"
          for f in "$apk" SHA256SUMS.txt; do cmp "$original/$f" "$dir/$f"; done

          # Tolerate a partially staged draft, but never overwrite an asset.
          for f in "$apk" SHA256SUMS.txt; do
            if ! jq -e --arg f "$f" 'any(.assets[]; .name == $f)' <<<"$draft" >/dev/null; then
              gh release upload "$tag" "$original/$f"
            fi
          done
          staged="$RUNNER_TEMP/staged-release"
          gh release download "$tag" --pattern "$apk" --pattern SHA256SUMS.txt --dir "$staged"
          for f in "$apk" SHA256SUMS.txt; do cmp "$original/$f" "$staged/$f"; done
          echo "Verified both draft assets for $tag against Android run $run." >> "$GITHUB_STEP_SUMMARY"
