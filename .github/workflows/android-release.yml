name: Android production APK
on:
  push:
    branches: ['**']
  workflow_dispatch:
    inputs:
      mode:
        description: 'Rehearse without secrets, or sign, test and publish with the backed-up production key'
        type: choice
        options: [rehearsal, production]
        default: rehearsal
permissions:
  contents: read
concurrency:
  group: android-release-${{ (inputs.mode == 'production' || contains(github.event.head_commit.message, '[release-android]')) && 'production' || github.ref }}
  cancel-in-progress: false
jobs:
  assemble:
    name: Build unsigned release and independent test driver
    if: github.ref_type == 'branch' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[test-android-update]') || contains(github.event.head_commit.message, '[release-android]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      mode: ${{ steps.channel.outputs.mode }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: { persist-credentials: false }
      - id: channel
        env:
          MODE: ${{ (inputs.mode == 'production' || contains(github.event.head_commit.message, '[release-android]')) && 'production' || 'rehearsal' }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          OTHER_TRUSTED_BRANCH: ${{ vars.FT_PDF_RELEASE_BRANCH }}
        run: |
          if [[ "$MODE" == production ]]; then
            if [[ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" && "$GITHUB_REF_NAME" != "$OTHER_TRUSTED_BRANCH" ]]; then
              echo '::error::Production signing is restricted to the default or maintainer-approved release branch.'; exit 1
            fi
            if ! grep -Eqx '[0-9a-f]{64}' android/release/certificate.sha256; then
              echo '::error::No production pin. Follow docs/android-release.md on the key owner’s computer. Do not generate a key here.'; exit 1
            fi
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - run: npm ci
      - name: Build both release-mode packages with no signing credentials
        working-directory: android
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/unsigned"; mkdir "$dir"
          ./gradlew --stacktrace -PftUpgradeFixture=true :app:assembleRelease
          cp app/build/outputs/apk/release/app-release-unsigned.apk "$dir/upgrade-fixture-unsigned.apk"
          ./gradlew --stacktrace :app:assembleRelease :app:testReleaseUnitTest :updateProbe:assembleDebug :updateProbe:assembleDebugAndroidTest
          cp app/build/outputs/apk/release/app-release-unsigned.apk "$dir/candidate-unsigned.apk"
          cp updateProbe/build/outputs/apk/debug/updateProbe-debug.apk "$dir/probe.apk"
          cp updateProbe/build/outputs/apk/androidTest/debug/updateProbe-debug-androidTest.apk "$dir/probe-test.apk"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-inputs
          path: ${{ runner.temp }}/unsigned
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
  upgrade:
    name: Verify signer and reopen a document after an installed update
    needs: assemble
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    # Configure branch restrictions and approval on android-production. Never use
    # repository-level credentials; android-rehearsal is an empty environment.
    environment: ${{ needs.assemble.outputs.mode == 'production' && 'android-production' || 'android-rehearsal' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: { persist-credentials: false }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: unsigned-inputs, path: '${{ runner.temp }}/inputs' }
      - run: |
          echo "RELEASE_INPUT=$RUNNER_TEMP/inputs" >> "$GITHUB_ENV"
          echo "RELEASE_WORK=$RUNNER_TEMP/verified-android" >> "$GITHUB_ENV"
      - name: Rehearse without any release credentials
        if: needs.assemble.outputs.mode == 'rehearsal'
        run: python3 android/release/prepare.py rehearsal
      - name: Sign with the pinned, owner-backed key (no fallback)
        if: needs.assemble.outputs.mode == 'production'
        env:
          GH_TOKEN: ${{ github.token }}
          FT_PDF_RELEASE_P12_BASE64: ${{ secrets.FT_PDF_RELEASE_P12_BASE64 }}
          FT_PDF_RELEASE_PASSWORD: ${{ secrets.FT_PDF_RELEASE_PASSWORD }}
        run: python3 android/release/prepare.py production
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash android/release/device-upgrade.sh
      - name: Summarize the exact tested APK
        run: |
          jq -r '"**\(.channel)** · \(.applicationId) · \(.versionName) (\(.versionCode))\n\nUpgrade passed from: \(.previousProduction // "same-key fixture, not 3.3.1").\n\nCertificate SHA-256: `\(.certificateSha256)`\n\nAPK SHA-256: `\(.sha256)`"' "$RELEASE_WORK/out/production.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Transfer tested production bytes only
        if: needs.assemble.outputs.mode == 'production'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tested-production
          path: ${{ runner.temp }}/verified-android/out
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
  publish:
    name: Publish the tested APK without rebuilding or re-signing
    needs: [assemble, upgrade]
    if: needs.assemble.outputs.mode == 'production'
    permissions: { contents: write }
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: { persist-credentials: false }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: tested-production, path: '${{ runner.temp }}/tested' }
      - name: Check signature and checksum, stage a new draft, read it back, then publish
        env: { GH_TOKEN: '${{ github.token }}' }
        run: python3 android/release/publish.py "$RUNNER_TEMP/tested"
