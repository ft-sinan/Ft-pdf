name: Ft PDF checks
on:
  push:
    paths-ignore:
      ['android/**', 'public/downloads/**', '**/*.md', '.github/workflows/android-debug.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
